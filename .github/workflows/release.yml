# Creates the vX.Y.Z tag and GitHub release when a push to main changes the plugin version.
name: Release

on:
  push:
    branches: [main]
    paths: ['.claude-plugin/plugin.json']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release the new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(jq -r .version .claude-plugin/plugin.json)"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            exit 0
          fi
          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          {
            echo "Changes since ${prev:-the first commit}:"
            echo
            git log --no-merges --format='- %s (%h)' ${prev:+"$prev"..}HEAD
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
